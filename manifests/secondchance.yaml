id: secondchance
display_name: "Cataclysm: Second Chance"
short_description: >-
  The successor to Tefnut's Expansion, remade from the ground up. A mod that
  aims to bring more hope and humor to whats normally a fairly grimdark setting.
description: >-
  New Kitsune mutation line, Crackhead Engineering & Weird Science Skills and
  related crafts & weapons(oh my god the weapons), WW2 American & Japanese
  weapons, uniforms, and museums, Various modest maid uniforms and related
  gear,  Survivor-ified versions of blankets, cloaks, uniforms, wrist computers,
  maid outfits, etc., various foods and related recipes, wildlife, robots, and
  mutants, 4 brand new Professions and a new vehicle. + Vehicle parts, mounted
  guns, and grid-powered air conditioners and floodlights.


  Plushies!!! Bodypillows!!!
