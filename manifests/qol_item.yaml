description: >-
  A set of handy items: a rope ladder you can hang from a ledge, a homemade
  water dispenser that lets you auto-drink from the fluid grid, a makeshift
  bandage and disinfectant your companions can use any number of times, ankle
  warmers for mutated feet, and plague masks that fit mutated mouths.  Also
  makes the small and large cardboard boxes craftable.
