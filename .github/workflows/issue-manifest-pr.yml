name: Issue Manifest PR

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: issue-manifest-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Invalidate previous issue validation
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'manifest')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: { contents: read, issues: read, statuses: write }
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      current: ${{ steps.guard.outputs.current }}
    steps:
      - name: Check issue snapshot and bot branch ownership
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const snapshot = context.payload.issue
            const { data: issue } = await github.rest.issues.get({ ...repo, issue_number: snapshot.number })
            if (issue.body !== snapshot.body || issue.updated_at !== snapshot.updated_at || issue.state !== "open" || !issue.labels.some((label) => label.name === "manifest")) {
              core.notice("The issue changed; this run will not publish its stale snapshot.")
              return
            }
            const branch = `manifest/issue-${snapshot.number}`
            let sha = ""
            try {
              const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` })
              sha = ref.object.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (sha) {
              const { data: { statuses } } = await github.rest.repos.getCombinedStatusForRef({ ...repo, ref: sha, per_page: 100 })
              if (!statuses.some((status) => status.context === "Issue manifest validation" && status.creator?.login === "github-actions[bot]" && status.description?.startsWith(`Issue #${snapshot.number}: `))) {
                core.setFailed("The issue branch has changes not published by this workflow; refusing to overwrite them.")
                return
              }
              core.setOutput("sha", sha)
              await github.rest.repos.createCommitStatus({ ...repo, sha, state: "pending", context: "Issue manifest validation", description: `Issue #${snapshot.number}: revalidation required` })
            }
            core.setOutput("current", "true")

  validate:
    name: Validate issue manifest
    needs: prepare
    if: needs.prepare.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      id: ${{ steps.extract.outputs.id }}
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x, cache: true }

      - name: Extract manifest from issue
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          OUT: ${{ runner.temp }}/out
        run: |
          mkdir -p "$OUT"
          if id=$(deno run --allow-env=ISSUE_BODY --allow-write=manifests scripts/issue-manifest.ts 2> "$OUT/report.md"); then
            deno fmt "manifests/$id.yaml"
            cp "manifests/$id.yaml" "$OUT/manifest.yaml"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manifest and URLs
        id: check
        if: steps.extract.outputs.id
        env:
          ID: ${{ steps.extract.outputs.id }}
          REPORT_FILE: ${{ runner.temp }}/out/report.md
        run: |
          printf 'M\0manifests/%s.yaml\0' "$ID" > "$RUNNER_TEMP/changes.z"
          network_hosts=$(deno run scripts/validate-manifests.ts --network-hosts)
          if deno run --allow-read=manifests,scripts,"$RUNNER_TEMP" --allow-write="$REPORT_FILE" --allow-net="$network_hosts" scripts/validate-manifests.ts check-urls --changes-file "$RUNNER_TEMP/changes.z" --report "$REPORT_FILE"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-manifest
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Report and open PR
    needs: [prepare, validate]
    if: always() && (needs.prepare.outputs.current == 'true' || needs.prepare.outputs.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {
      contents: write,
      issues: write,
      pull-requests: write,
      statuses: write,
    }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: issue-manifest
          path: ${{ runner.temp }}/out

      - name: Prepare a validated commit before changing any branch
        id: commit
        if: needs.validate.result == 'success' && needs.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        env:
          ID: ${{ needs.validate.outputs.id }}
          OUT: ${{ runner.temp }}/out
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs")
            const repo = { owner: context.repo.owner, repo: context.repo.repo }
            const snapshot = context.payload.issue
            const { data: issue } = await github.rest.issues.get({ ...repo, issue_number: snapshot.number })
            if (issue.body !== snapshot.body || issue.updated_at !== snapshot.updated_at || issue.state !== "open" || !issue.labels.some((label) => label.name === "manifest")) {
              core.setFailed("The issue changed during validation; refusing to publish the stale manifest.")
              return
            }
            const path = `manifests/${process.env.ID}.yaml`
            const content = fs.readFileSync(`${process.env.OUT}/manifest.yaml`, "utf8")
            const { data: base } = await github.rest.git.getCommit({ ...repo, commit_sha: context.sha })
            const { data: blob } = await github.rest.git.createBlob({ ...repo, content, encoding: "utf-8" })
            let exists = false
            try {
              const { data: original } = await github.rest.repos.getContent({ ...repo, path, ref: context.sha })
              exists = true
              if (original.sha === blob.sha) {
                core.setOutput("unchanged", "true")
                return
              }
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const title = `${exists ? "fix: update" : "feat: add"} ${process.env.ID} manifest`
            const { data: tree } = await github.rest.git.createTree({ ...repo, base_tree: base.tree.sha, tree: [{ path, mode: "100644", type: "blob", sha: blob.sha }] })
            const { data: commit } = await github.rest.git.createCommit({
              ...repo, tree: tree.sha, parents: [context.sha],
              message: `${title}\n\nCo-authored-by: ${snapshot.user.login} <${snapshot.user.id}+${snapshot.user.login}@users.noreply.github.com>`
            })
            await github.rest.repos.createCommitStatus({ ...repo, sha: commit.sha, state: "success", context: "Issue manifest validation", description: `Issue #${snapshot.number}: validated`, target_url: process.env.RUN_URL })
            core.setOutput("sha", commit.sha)
            core.setOutput("title", title)

      - name: Publish the validated commit and open PR
        id: pr
        if: steps.commit.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          TITLE: ${{ steps.commit.outputs.title }}
          NUMBER: ${{ github.event.issue.number }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config --local credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          branch="manifest/issue-$NUMBER"
          git fetch --no-tags --depth=1 origin "$SHA"
          git push --force-with-lease="refs/heads/$branch:$EXPECTED_SHA" origin "$SHA:refs/heads/$branch"
          if gh pr view "$branch" --json state --jq .state | grep -qx OPEN; then
            gh pr edit "$branch" --title "$TITLE"
          else
            gh pr create --head "$branch" --title "$TITLE" --body "Closes #$NUMBER"
          fi
          echo "url=$(gh pr view "$branch" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Mark failed updates on the previous PR head
        if: always() && needs.prepare.outputs.sha && (needs.prepare.result != 'success' || needs.validate.result != 'success' || needs.validate.outputs.valid != 'true' || steps.commit.outcome != 'success' || steps.pr.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.SHA,
              state: "failure", context: "Issue manifest validation", description: `Issue #${context.payload.issue.number}: update failed validation or publication`
            })

      - name: Create or update the bot comment
        if: always()
        uses: actions/github-script@v7
        env:
          VALID: ${{ needs.validate.outputs.valid }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          UNCHANGED: ${{ steps.commit.outputs.unchanged }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          REPORT: ${{ runner.temp }}/out/report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs")
            const snapshot = context.payload.issue
            const current = await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: snapshot.number })
            if (current.data.body !== snapshot.body || current.data.updated_at !== snapshot.updated_at) return
            const marker = "<!-- registry-index-issue-manifest -->"
            const { VALID, COMMIT_OUTCOME, UNCHANGED, PR_OUTCOME, PR_URL, REPORT, RUN_URL } = process.env
            const report = fs.existsSync(REPORT) ? fs.readFileSync(REPORT, "utf8") : "No report; see the workflow log."
            const escaped = report
              .normalize("NFKC")
              .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll("@", "＠")
              .slice(0, 58_000)
            const status = VALID !== "true"
              ? "**failure**. Edit this issue to fix the manifest; the bot retries on every edit."
              : COMMIT_OUTCOME !== "success" ? "**success**, but preparing the pull request failed; see the log."
              : UNCHANGED === "true" ? "**success**. The manifest is identical to the registry; no new pull request needed. Any earlier pull request is unchanged and must be reviewed separately."
              : PR_OUTCOME !== "success" ? "**success**, but opening the pull request failed; see the log."
              : `**success**. Pull request: ${PR_URL}`
            const body = `${marker}\nManifest validation: ${status} ([log](${RUN_URL}))\n<pre>${escaped}</pre>`
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number }
            let existing
            let pages = 0
            for await (const { data: comments } of github.paginate.iterator(github.rest.issues.listComments, { ...issue, per_page: 100 })) {
              existing = comments.find((comment) => comment.user?.login === "github-actions[bot]" && comment.body?.startsWith(marker))
              if (existing) break
              if (++pages === 10 && comments.length === 100) {
                core.warning("Bot comment not found within 1,000 comments; see the workflow log instead.")
                return
              }
            }
            if (existing) await github.rest.issues.updateComment({ ...issue, comment_id: existing.id, body })
            else await github.rest.issues.createComment({ ...issue, body })
