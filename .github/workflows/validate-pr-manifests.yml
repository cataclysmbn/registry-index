name: Validate PR Manifests

on:
  pull_request:
    paths:
      - "manifests/**"
      - "generated/mod_manifest.schema.json"
      - "scripts/**"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/validate-pr-manifests.yml"
      - ".github/workflows/comment-manifest-validation.yml"

permissions:
  contents: read

jobs:
  validate-pr-manifests:
    name: Validate changed manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Collect changed manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-status -z -M -C "$BASE_SHA" HEAD -- manifests > "$RUNNER_TEMP/manifest_changes.z"
          if [ -s "$RUNNER_TEMP/manifest_changes.z" ]; then
            echo "Collected NUL-delimited manifest changes."
          else
            echo "No manifest changes found."
          fi

      - name: Create fallback report
        env:
          REPORT_FILE: ${{ runner.temp }}/manifest-validation.md
        run: |
          printf '# Manifest validation report\n\nValidator did not produce a report. Check the workflow log for the failure.\n' > "$REPORT_FILE"

      - name: Validate changed manifests and URLs
        id: validation
        continue-on-error: true
        env:
          CHANGES_FILE: ${{ runner.temp }}/manifest_changes.z
          REPORT_FILE: ${{ runner.temp }}/manifest-validation.md
        run: |
          set +e
          deno run --allow-read=manifests,scripts,"$RUNNER_TEMP" --allow-write="$REPORT_FILE" --allow-net scripts/validate-manifests.ts check-urls --changes-file "$CHANGES_FILE" --report "$REPORT_FILE"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check tooling and all static manifests
        run: |
          deno fmt --check
          deno lint
          deno check scripts/validate-manifests.ts scripts/validate-manifests_test.ts
          deno test --allow-read --allow-write scripts
          deno task validate

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-validation-report
          path: ${{ runner.temp }}/manifest-validation.md
          if-no-files-found: error
          retention-days: 14

      - name: Fail when validation found errors
        if: steps.validation.outputs.exit_code != '0'
        run: exit 1
